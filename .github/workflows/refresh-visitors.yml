name: Refresh visitor count

# Rebuilds the site once a day so the footer visit counter (a build-time
# snapshot of Google Analytics) stays current. Requires a repository secret
# AMPLIFY_BUILD_HOOK containing an AWS Amplify incoming-webhook URL; without
# it this workflow does nothing.

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Amplify build
        env:
          HOOK: ${{ secrets.AMPLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "AMPLIFY_BUILD_HOOK is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '' "$HOOK" > /dev/null
          echo "Amplify build triggered."
